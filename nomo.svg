<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Nomo — a search tree with one lit branch</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#173a4a"/>
      <stop offset="1" stop-color="#0b1622"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5b041" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5b041" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- explored branches -->
  <g fill="none" stroke="#dfe8ef" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 448 L256 300"/>
    <path d="M256 372 L196 338"/>
    <path d="M256 300 L172 214 L124 138"/>
    <path d="M172 214 L206 124"/>
    <path d="M256 300 L340 214 L302 126"/>
  </g>
  <!-- the branch being pursued -->
  <path d="M340 214 L384 120" fill="none" stroke="#f5b041" stroke-width="16" stroke-linecap="round"/>
  <!-- open / ruled-out leaves -->
  <g fill="#10232f" stroke="#dfe8ef" stroke-width="10">
    <circle cx="196" cy="338" r="16"/>
    <circle cx="124" cy="138" r="18"/>
    <circle cx="206" cy="124" r="18"/>
    <circle cx="302" cy="126" r="18"/>
  </g>
  <!-- the first lit leaf -->
  <circle cx="384" cy="116" r="62" fill="url(#glow)"/>
  <circle cx="384" cy="116" r="30" fill="#f5b041"/>
  <circle cx="384" cy="116" r="12" fill="#fff4dc"/>
</svg>
